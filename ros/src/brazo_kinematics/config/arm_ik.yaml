/**:
  ros__parameters:
    frame_id: base_link
    # Geometría [m]
    L1: 0.080            # TODO medir: brazo superior
    L2: 0.080            # TODO medir: antebrazo
    h: 0.070             # TODO medir: altura del pivote del hombro
    d: 0.0               # TODO medir: offset horizontal del pivote
    e: 0.055             # TODO medir: muñeca -> punta, horizontal
    c: 0.060             # TODO medir: muñeca -> punta, vertical (+ = punta abajo)
