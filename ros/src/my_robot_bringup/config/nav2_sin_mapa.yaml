# Nav2 sin mapa (T2, primera tarea)
#
# Idea: no hay /map ni AMCL. Todo pasa en el frame "odom", que es lo que el robot
# cree que recorrio segun sus ruedas. Es como caminar con los ojos vendados contando
# pasos: no sabes donde estas en el plano, pero si cuanto avanzaste desde que saliste.
#
# Los dos "costmaps" (mapas de costo: una grilla donde cada celda dice cuanto cuesta
# pasar por ahi) son ventanas que se mueven con el robot ("rolling window") y se
# llenan solo con lo que ven los 3 ultrasonidos.
#
# La pregunta que responde esta prueba: con solo 3 ultrasonidos, ¿Nav2 entiende el
# pasillo o lo marca como bloqueado? Si falla, T2 usa control por ultrasonidos.
#
# Todas las velocidades son lentas a proposito: primero que funcione, despues rapido.

# ---------------------------------------------------------------------------
# bt_navigator: el "jefe". Recibe el objetivo (navigate_to_pose) y sigue un arbol
# de comportamiento (behavior tree): una receta de pasos tipo "planifica, segui la
# ruta, si te trabas retrocede y volve a intentar".
# ---------------------------------------------------------------------------
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: odom            # sin mapa: el objetivo se da en odom
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names: ["compute_path_error_code", "follow_path_error_code"]

# ---------------------------------------------------------------------------
# planner_server: el "GPS". Calcula la ruta completa en el costmap global.
# ---------------------------------------------------------------------------
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.10
      use_astar: false
      allow_unknown: true         # lo que no vio todavia se puede cruzar

# ---------------------------------------------------------------------------
# controller_server: el "conductor". Sigue la ruta y publica /cmd_vel.
# Regulated Pure Pursuit: persigue un punto un poco adelante sobre la ruta, como
# cuando manejas mirando unos metros adelante y no el capot. "Regulated" = frena
# solo en curvas cerradas y cerca de obstaculos.
# ---------------------------------------------------------------------------
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    odom_topic: /odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    # Si en 10 s no avanzo 5 cm, se considera trabado
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 10.0

    # Llego cuando esta a menos de 5 cm y 0,25 rad (unos 15 grados) del objetivo
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.25
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.15            # m/s
      lookahead_dist: 0.25                # cuanto mas adelante mira
      min_lookahead_dist: 0.15
      max_lookahead_dist: 0.4
      use_velocity_scaled_lookahead_dist: false
      approach_velocity_scaling_dist: 0.3
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.3
      regulated_linear_scaling_min_speed: 0.05
      use_cost_regulated_linear_velocity_scaling: false
      # Antes de arrancar gira en el lugar hasta mirar hacia la ruta
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.8  # rad/s
      rotate_to_heading_min_angle: 0.6
      max_angular_accel: 2.0
      allow_reversing: false
      interpolate_curvature_after_goal: false

# ---------------------------------------------------------------------------
# Costmap local: ventana chica alrededor del robot, la usa el conductor.
# ---------------------------------------------------------------------------
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 10.0
      publish_frequency: 5.0
      rolling_window: true
      width: 2                    # m
      height: 2
      resolution: 0.02            # celdas de 2 cm: los pasillos miden 40 cm
      # Contorno del robot: 27 x 16 cm (medido), centrado en base_footprint
      footprint: "[[0.135, 0.08], [0.135, -0.08], [-0.135, -0.08], [-0.135, 0.08]]"
      plugins: ["range_layer", "inflation_layer"]
      range_layer:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        # Los publica distancias_a_range, uno por ultrasonido
        topics: ["/ultrasonido/frente", "/ultrasonido/izq", "/ultrasonido/der"]
        input_sensor_type: ULTRASOUND
        clear_on_max_reading: true   # si mide "nada", limpia el cono
        no_readings_timeout: 2.0
        phi: 1.2
        inflate_cone: 1.0
        clear_threshold: 0.2
        mark_threshold: 0.8
      # Inflado: un "colchon" de costo alrededor de cada pared para que la ruta no
      # pase rozando. Si el colchon llega al medio del pasillo, las dos paredes
      # "empujan" y lo mas barato es el centro, como una canaleta. Asi se centra
      # sin suponer un ancho fijo: 0.30 centra pasillos de hasta 60 cm; en los mas
      # anchos va a mas de 30 cm de cada pared. Tambien aleja la ruta de la pared
      # del fondo en las curvas, donde puede saltar el freno de emergencia
      # (micro_ros/main/seguridad.c, ~4 cm con el sensor de adelante).
      # Costo = 252 * e^(-cost_scaling_factor * (distancia - 0.08)); 0.08 = medio ancho.
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.30      # m
        cost_scaling_factor: 2.5    # baja de a poco: la canaleta se nota

# ---------------------------------------------------------------------------
# Costmap global: ventana mas grande, la usa el planificador. Sin mapa estatico.
# ---------------------------------------------------------------------------
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 2.0
      publish_frequency: 1.0
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.02
      track_unknown_space: true
      footprint: "[[0.135, 0.08], [0.135, -0.08], [-0.135, -0.08], [-0.135, 0.08]]"
      plugins: ["range_layer", "inflation_layer"]
      range_layer:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        topics: ["/ultrasonido/frente", "/ultrasonido/izq", "/ultrasonido/der"]
        input_sensor_type: ULTRASOUND
        clear_on_max_reading: true
        no_readings_timeout: 2.0
        phi: 1.2
        inflate_cone: 1.0
        clear_threshold: 0.2
        mark_threshold: 0.8
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.30      # m
        cost_scaling_factor: 2.5    # baja de a poco: la canaleta se nota

# ---------------------------------------------------------------------------
# behavior_server: los "planes B" cuando se traba: girar, retroceder, esperar.
# ---------------------------------------------------------------------------
behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.3
    rotational_acc_lim: 2.0
